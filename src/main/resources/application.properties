spring.application.name=GymManagementSystem
server.port=8090

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/Gym_Management_System?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=829099
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Custom login credentials for security dependency
spring.security.user.name=admin
spring.security.user.password=admin123

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

jwt.secret=ChangeThisToA256BitSecretKeyForProduction

jwt.expiration=86400000

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.security=DEBUG
